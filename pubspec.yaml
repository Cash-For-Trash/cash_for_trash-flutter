name: cash_for_trash
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  dio: ^5.9.1

  go_router: ^17.1.0

  shared_preferences: ^2.5.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  
  flutter_screenutil: ^5.9.3

  get_it: ^9.2.1
  cached_network_image: ^3.4.1
  dartz: ^0.10.1
  flutter_svg: ^2.2.4
  provider: ^6.1.5+1

  json_annotation: ^4.9.0
  flutter_animate: ^4.5.2
  pretty_dio_logger: ^1.4.0
  flutter_localizations:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  animated_toggle_switch: ^0.8.7
  pinput: ^6.0.2
  flutter_secure_storage: ^10.3.1
  google_maps_flutter: ^2.17.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  flutter_dotenv: ^5.1.0
  cloudinary_api: ^1.1.1
  cloudinary_url_gen: ^1.8.0

  image_picker: ^1.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.13.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/images/
    - assets/logo/
    - lib/core/localization/l10n/


  # An image asset can refer to one or more resolution-specific "variants", see
